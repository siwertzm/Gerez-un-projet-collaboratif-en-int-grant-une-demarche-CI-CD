# Identifiants du projet SonarCloud
sonar.projectKey=siwertzm_Gerez-un-projet-collaboratif-en-int-grant-une-demarche-CI-CD
sonar.organization=siwertzm

# Sources analysées (back Java + front Angular/TS)
sonar.sources=back/src/main,front/src/app
sonar.tests=back/src/test,front/src/app
sonar.test.inclusions=back/src/test/**/*,front/src/app/**/*.spec.ts
sonar.exclusions=front/src/app/**/*.spec.ts,**/.DS_Store

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Back-end : binaires compilés + rapport de couverture Jacoco (XML)
sonar.java.binaries=back/target/classes
sonar.coverage.jacoco.xmlReportPaths=back/target/site/jacoco/jacoco.xml
# Dépendances Java (jars) résolues par mvn dans le cache local du runner GitHub Actions
sonar.java.libraries=/home/runner/.m2/repository/**/*.jar
sonar.java.test.libraries=/home/runner/.m2/repository/**/*.jar

# Front-end : rapport de couverture Karma/Istanbul (lcov)
sonar.javascript.lcov.reportPaths=front/coverage/bobapp/lcov.info